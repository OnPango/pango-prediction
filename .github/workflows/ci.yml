# Continuous integration for PANGO Prediction.
#
# Runs the quality gates from AGENTS.md and checks that the CPU image builds and
# starts, on every pull request into dev or main and on every push to them.
# Nothing is published or deployed.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Declaring bash makes GitHub run every step with `bash -eo pipefail`; without it
# a step runs with `bash -e`, and a failure on the left of a pipe goes unseen.
defaults:
  run:
    shell: bash

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The same install as "Quality gates" in AGENTS.md: both dependency lists
      # are read from pyproject.toml, so the workflow cannot drift from it.
      - name: Install dependencies
        id: install
        run: >-
          python -c "import subprocess, sys, tomllib;
          p = tomllib.load(open('pyproject.toml', 'rb'));
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          *p['project']['dependencies'], *p['dependency-groups']['dev']])"

      - name: Tests
        run: python -m pytest

      # Lint and types still run when the tests fail, so one run reports every
      # problem instead of the first one.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy pango_prediction tests

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -f docker/Dockerfile.api -t pango-prediction:ci .

      # The factory raises without a credential and the container must exit,
      # rather than start a prediction service that answers any caller.
      - name: Refuses to start without a service credential
        run: |
          docker run -d --name no-token pango-prediction:ci
          if ! code=$(timeout 30 docker wait no-token); then
            docker rm -f no-token
            echo "::error::The container kept running without PANGO_PREDICTION_SERVICE_TOKEN."
            exit 1
          fi
          docker logs no-token 2>&1 | tail -n 5
          docker rm no-token
          if [ "$code" = "0" ]; then
            echo "::error::The container exited cleanly without a credential; it should fail."
            exit 1
          fi
          echo "Exited with code $code without a credential, as intended."

      - name: Start with a service credential
        run: >-
          docker run -d --name service -p 8000:8000
          -e PANGO_PREDICTION_SERVICE_TOKEN=ci-only-token
          pango-prediction:ci

      - name: Health endpoint answers
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not answer within 30 seconds."
          exit 1

      - name: Forecast endpoint rejects a request without a token
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/v1/forecasts \
            -H 'Content-Type: application/json' \
            --data @tests/fixtures/forecast_request_minimal.json)
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 without a token, got $status."
            exit 1
          fi
          echo "401 without a token, as intended."

      - name: Forecast endpoint serves a fixture request with the token
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/v1/forecasts \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-only-token' \
            --data @tests/fixtures/forecast_request_minimal.json)
          head -c 600 response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Expected 200 for the fixture request, got $status."
            exit 1
          fi

      - name: Service logs
        if: ${{ always() }}
        run: |
          docker logs service 2>&1 | tail -n 50 || true
          docker rm -f service || true
